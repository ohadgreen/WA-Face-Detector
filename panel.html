<!doctype html>
<html lang="en" class="i18n-pending">
<head>
<meta charset="utf-8">
<title>Spot My Kid</title>
<style>
  :root { color-scheme: light; --line:#e2e2e6; --muted:#6b6b70; --accent:#1a7f4b; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; font-size: 13px;
         background: #f7f7f8; color: #16161a; }
  main { padding: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 9px;
          padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; }
  .card-head { display: flex; justify-content: space-between; align-items: center;
               margin-bottom: 8px; }
  .card-head h2 { margin: 0; }
  #addToggle { padding: 6px 12px; font-weight: 600; }
  #logToggle { padding: 4px 10px; font-size: 11.5px; }
  label { display: block; margin: 8px 0 3px; color: var(--muted); font-size: 11.5px;
          text-transform: uppercase; letter-spacing: .03em; }
  select, input[type=text], input[type=number] { width: 100%; padding: 6px 8px;
          border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: #fff; }
  input[type=file] { font-size: 11px; width: 100%; }
  /* The reference photos are the one required step, so the browser's own
     "Choose files" button is drawn like the primary buttons, only larger. */
  input[type=file]::file-selector-button { background: var(--accent); color: #fff; border: 0;
          border-radius: 7px; padding: 10px 18px; margin-inline-end: 10px; font-size: 13px;
          font-weight: 600; cursor: pointer; }
  button.act { background: var(--accent); color: #fff; border: 0; border-radius: 7px;
               padding: 9px 14px; font-size: 13px; cursor: pointer; }
  button.act.ghost { background: #fff; color: #16161a; border: 1px solid var(--line); }
  button.act:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .watch { border-inline-start: 3px solid var(--accent); }
  .watch .title { font-weight: 650; font-size: 13.5px; }
  .pill { background: #eaf6ee; color: #14663c; border-radius: 20px; padding: 2px 9px;
          font-size: 11px; font-weight: 650; }
  .pill.none { background: #f0f0f2; color: var(--muted); }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; background: #15151a;
         color: #d6d6d6; padding: 9px; border-radius: 7px; height: 110px; overflow: auto;
         white-space: pre-wrap; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .thumb { background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 5px;
           cursor: pointer; display: block; }
  .thumb:has(input:checked) { outline: 2.5px solid var(--accent); }
  .thumb img { width: 100%; height: 88px; object-fit: cover; border-radius: 4px; background: #eee; }
  .thumb .s { display: flex; align-items: center; gap: 5px; margin-top: 4px;
              font-size: 11px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 11.5px; line-height: 1.5; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .pick { display: flex; justify-content: space-between; gap: 8px; width: 100%;
          margin-top: 5px; padding: 5px 8px; border: 0; border-radius: 6px; font: inherit;
          font-size: 12px; text-align: start; background: #f0f0f2; color: var(--muted); }
  .pick.set { background: #eaf6ee; color: #14663c; font-weight: 600; cursor: pointer; }
  .pick.folded { padding: 8px 10px; font-size: 13px; outline: 1px solid #b9dfc8; }
  .pick .chg { font-weight: 400; text-decoration: underline; white-space: nowrap; }
  label.check { display: flex; align-items: center; gap: 6px; margin: 10px 0 0;
                text-transform: none; letter-spacing: 0; font-size: 12.5px; color: inherit; }
  label.check.inline { margin: 0; font-size: 11px; color: var(--muted); }
  .thumb.gone { cursor: default; }
  .thumb .ph { height: 88px; display: flex; align-items: center; justify-content: center;
               background: #eee; border-radius: 4px; color: var(--muted); font-size: 11px;
               text-align: center; padding: 4px; }
  select option:checked { background: #1a7f4b linear-gradient(0deg,#1a7f4b,#1a7f4b); color: #fff; }
  /* Hidden until panel.js has set the language, so a Hebrew panel never
     flashes English first. If panel.js never runs (a module failed to
     load), the English panel appears after a second instead of a blank one. */
  .i18n-pending body { visibility: hidden; animation: cpf-reveal 0s 1s forwards; }
  @keyframes cpf-reveal { to { visibility: visible; } }
  /* Spacing meant for Latin capitals breaks up Hebrew words. */
  :lang(he) label { letter-spacing: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="card-head">
      <h2 data-i18n="savedWatches">Saved watches</h2>
      <button type="button" class="act" id="addToggle" aria-expanded="false" aria-controls="addCard"
        title="Add a group to watch" data-i18n-title="addGroup" data-i18n="addWatch">+ Add watch</button>
    </div>
    <div id="setupList"></div>
  </div>

  <div class="card" id="addCard" hidden>
    <h2 data-i18n="addGroup">Add a group to watch</h2>
    <label data-i18n="watchThisGroup">Watch this group</label>
    <input type="text" id="srcFilter" dir="auto" placeholder="filter by name..." data-i18n-ph="filterByName" style="margin-bottom:4px">
    <select id="srcGroup" size="6"></select>
    <button type="button" class="pick" id="srcPick">nothing selected</button>
    <label data-i18n="sendMatchesTo">Send matches to</label>
    <input type="text" id="dstFilter" dir="auto" placeholder="filter by name..." data-i18n-ph="filterByName" style="margin-bottom:4px">
    <select id="dstGroup" size="6"></select>
    <button type="button" class="pick" id="dstPick">nothing selected</button>
    <label data-i18n="childName">Child's name</label><input type="text" id="childName" dir="auto" placeholder="e.g. Nir" data-i18n-ph="childNameExample">
    <label data-i18n="refPhotos">Reference photos of that child</label>
    <input type="file" id="refFiles" accept="image/*" multiple>
    <label data-i18n="matchThreshold">Match threshold</label><input type="number" id="thresh" dir="ltr" value="0.35" step="0.01" min="0.05" max="0.9">
    <p class="hint" data-i18n="thresholdHint">Start at 0.35. Lower it if the child is usually far from the camera.</p>
    <label class="check"><input type="checkbox" id="autoWatch" checked>
      <span data-i18n="autoWatchLabel">Auto-watch: check new photos in the background and alert me</span></label>
    <div class="row" style="margin-top:10px">
      <button class="act" id="addWatch" disabled data-i18n="saveWatch">Save watch</button>
      <button class="act ghost" id="refreshGroups" data-i18n="reloadGroups">Reload groups</button>
    </div>
  </div>

  <div id="watchList"></div>
  <div id="reviewCard" class="card" hidden>
    <h2 id="reviewTitle">Matches</h2>
    <p class="hint" id="reviewHint"></p>
    <div class="row" style="margin:8px 0">
      <button class="act" id="sendBtn" data-i18n="addToComposer">Add to composer</button>
      <button class="act ghost" id="doneBtn" data-i18n="markSeen">Mark as seen</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <button class="act ghost" id="stopBtn" hidden data-i18n="stopScan">Stop scan</button>
  <button type="button" class="act ghost" id="logToggle" aria-expanded="false" aria-controls="log"
    data-i18n="showLog">Show log</button>
  <div id="log" dir="ltr" hidden>idle</div>
</main>

<script type="module" src="panel.js"></script>
</body>
</html>
